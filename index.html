<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Frequency WAV Maker</title><style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:auto;padding:20px}textarea{width:100%;height:210px;font-size:16px;box-sizing:border-box}
input,select,button{font-size:16px;padding:10px;margin:6px 0}button{width:100%;font-weight:bold}.row{display:flex;gap:12px;flex-wrap:wrap}.box{padding:12px;background:#eee;border-radius:10px}.note{color:#666;line-height:1.5}progress{width:100%}</style></head><body>
<h2>マルチ周波数 WAV メーカー</h2>
<div class="box"><b>基本周波数：1～5,000 Hz</b><br>1 Hz刻みの5,000周波数を自動で含めます。位相を分散してブツブツ音を抑えます。</div>
<p>追加する周波数を1行に1つ入力（空欄でも作成可能）</p>
<textarea id="f" placeholder="例：&#10;70802&#10;198102"></textarea>
<div class="row"><label>長さ（秒）<br><input id="d" type="number" value="1" min="1" step="1"></label>
<label>サンプルレート<br><select id="r"><option selected>1536000</option><option>2000000</option></select></label></div>
<button id="b">WAVを作成・保存</button><progress id="p" max="1" value="0" hidden></progress><div id="s">準備完了</div>
<p class="note">基本1～5,000 Hzは、Schroeder位相を使ってピークの集中を抑えています。整数秒の長さでは基本周波数群がループ境界で連続しやすくなります。追加周波数も整数Hzなら同様です。実際の再生帯域は端末・DAC・アンプ・スピーカー等に依存します。</p>
<script>
const q=x=>document.getElementById(x),wait=()=>new Promise(r=>setTimeout(r,0));
function st(v,o,s){for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
q("b").onclick=async()=>{try{
 let ex=q("f").value.replaceAll(",","\n").split(/\n/).map(x=>x.trim().toLowerCase().replace("hz","")).filter(Boolean).map(Number);
 ex=[...new Set(ex)].filter(x=>x<1||x>5000);
 if(ex.some(x=>!isFinite(x)||x<=0))throw Error("追加周波数を正しく入力してください");
 let sr=+q("r").value,sec=+q("d").value;if(!isFinite(sec)||sec<=0)throw Error("長さを正しく入力してください");
 if(ex.some(x=>x>=sr/2))throw Error("追加周波数は "+sr/2+" Hz未満にしてください");
 let n=Math.floor(sr*sec),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);q("b").disabled=true;q("p").hidden=false;
 st(v,0,"RIFF");v.setUint32(4,36+n*2,true);st(v,8,"WAVE");st(v,12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);st(v,36,"data");v.setUint32(40,n*2,true);
 const N=5000,tp=2*Math.PI;
 // Build one 1-second period. Since all base tones are integer Hz, repeating it is exactly periodic.
 // Schroeder phases reduce crest factor compared with all-zero phase.
 let period=new Float64Array(sr);
 q("s").textContent="基本周波数を合成中…";
 for(let k=1;k<=N;k++){
   let phase=Math.PI*k*(k-1)/N;
   let w=tp*k/sr, c=Math.cos(w), ss=Math.sin(w);
   let y0=Math.sin(phase), y1=Math.sin(phase+w);
   period[0]+=y0;
   if(sr>1)period[1]+=y1;
   for(let i=2;i<sr;i++){let y=2*c*y1-y0;period[i]+=y;y0=y1;y1=y}
   if(k%100===0){q("p").value=.55*k/N;q("s").textContent="基本周波数を合成中 "+Math.round(100*k/N)+"%";await wait()}
 }
 // Add optional frequencies. Integer-Hz additions also repeat perfectly each second.
 for(let j=0;j<ex.length;j++){
   let f=ex[j],phase=Math.PI*(j+1)*(j+2)/(ex.length+1||1),w=tp*f/sr,c=Math.cos(w);
   let y0=Math.sin(phase),y1=Math.sin(phase+w);period[0]+=y0;if(sr>1)period[1]+=y1;
   for(let i=2;i<sr;i++){let y=2*c*y1-y0;period[i]+=y;y0=y1;y1=y}
 }
 // Normalize from measured peak rather than dividing by 5,000, preserving much more useful level.
 let peak=0;for(let i=0;i<sr;i++){let a=Math.abs(period[i]);if(a>peak)peak=a}
 let gain=peak?0.90/peak:0;
 for(let a=0;a<n;a+=50000){let e=Math.min(n,a+50000);for(let i=a;i<e;i++){let y=period[i%sr]*gain;v.setInt16(44+i*2,Math.max(-32767,Math.min(32767,Math.round(y*32767))),true)}
   q("p").value=.55+.45*e/n;q("s").textContent="WAV生成中 "+Math.round(e/n*100)+"%";await wait()}
 let bl=new Blob([buf],{type:"audio/wav"}),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;let srn=sr>=1000000?(sr/1000000).toString().replace(/\.0+$/,"")+"M":sr;a.download="mf_"+(5000+ex.length)+"_"+srn+".wav";a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);
 q("s").textContent="完成：基本5,000個 + 追加"+ex.length+"個";
}catch(e){alert(e.message);q("s").textContent="エラー"}finally{q("b").disabled=false;q("p").hidden=true}}
</script></body></html>
